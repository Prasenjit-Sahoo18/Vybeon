# Render Blueprint for VYBEON
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: vybeon-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vybeon-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: MUSIC_API_URL
        value: ""
      - key: MUSIC_API_KEY
        value: ""
      - key: PORT
        value: "3000"
    autoDeploy: true

databases:
  - name: vybeon-db
    plan: starter
    databaseName: vybeon
    user: vybeon_user
    postgresMajorVersion: 16
